name: Construire l'APK MEERA TV

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # On installe Gradle directement (au lieu d'utiliser ./gradlew) pour
      # ne pas dépendre du fichier "wrapper" habituellement généré par
      # Android Studio.
      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Construire l'APK et le AAB
        run: gradle assembleDebug bundleRelease

      - name: Mettre les fichiers à disposition
        uses: actions/upload-artifact@v4
        with:
          name: MeeraTV-build
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/bundle/release/app-release.aab